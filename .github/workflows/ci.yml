name: CI (temporary ACL diagnostic only)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    # DRAFT / DO NOT MERGE: retained for restoration, not authorized this attempt.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: '2026.9.1'
          install: true
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: mise run fmt:check

      - name: Run linters
        run: mise run lint

      - name: Run vet
        run: mise run vet

      - name: Run tests
        run: mise run test

      - name: Run native helper regressions
        run: mise run test:native-helpers

      - name: Run vulnerability checks
        run: mise run vuln

      - name: Build CLI
        run: mise run build

  native-linux:
    # Candidate HEAD only; no duplicate native lane on a later push to main.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - name: Check out candidate HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Intentionally fails even when both ACLs are absent. No subsequent stages.
      - name: Observe ancestor metadata only (always fails closed)
        timeout-minutes: 1
        run: python3 -B -I .github/scripts/native_ci.py diagnose-acl
